<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="listening-grad" x1="10" y1="14" x2="86" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B7BFF"/>
      <stop offset="1" stop-color="#38D6FF"/>
    </linearGradient>
  </defs>

  <!-- 傾聴：耳のシルエット + 届く音波 + 相手の吹き出し -->

  <!-- 話し手の吹き出し（左） -->
  <path d="M12 30a10 10 0 0 1 10-10h14a10 10 0 0 1 10 10v10a10 10 0 0 1-10 10h-9l-7 7v-7a10 10 0 0 1-8-9.8V30Z"
        fill="#EAF1FF"/>
  <circle cx="21" cy="30" r="2.4" fill="#8FB3FF"/>
  <circle cx="29" cy="30" r="2.4" fill="#8FB3FF"/>
  <circle cx="37" cy="30" r="2.4" fill="#8FB3FF"/>

  <!-- 届く音波（3本） -->
  <path d="M46 40c4 4 4 12 0 16" stroke="url(#listening-grad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M53 34c8 8 8 20 0 28" stroke="url(#listening-grad)" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M60 28c12 12 12 28 0 40" stroke="url(#listening-grad)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- 耳（傾聴する側） -->
  <path d="M70 22c10 0 18 9 18 20 0 8-4 13-9 17-3 2.4-4 4-4 7v3.5a6.5 6.5 0 0 1-13 0v-3a15 15 0 0 1-9-13.8c0-14 9-30.7 17-30.7Z"
        fill="url(#listening-grad)"/>
  <path d="M74 34c5 1.6 8 6.2 8 10.8 0 4.4-2.6 7.2-5.4 9.3" stroke="#0F2A66" stroke-width="2.6" stroke-linecap="round" opacity="0.35"/>
</svg>
