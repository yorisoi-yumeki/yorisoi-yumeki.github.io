<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一言メッセージをお寄せください | 杉田夢生</title>
<meta name="description" content="杉田夢生への一言コメント・推薦文をお寄せください。いただいた内容の一部は、本人の確認のうえポートフォリオサイトの「周囲からの声」に掲載させていただく場合があります。">
<meta name="robots" content="noindex">

<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<style>
  /* Googleフォームの埋め込み。フォームの高さは内容量に応じて変わるため、
     ある程度余裕を持たせた高さを指定している（短すぎるとフォーム内で
     二重スクロールが発生するため）。 */
  .voice-form-embed {
    width: 100%;
    max-width: 640px;
    height: 1310px;
    border: none;
    border-radius: var(--radius-m);
    box-shadow: var(--shadow-card);
    background: var(--surface);
  }
  .voice-form-fallback { margin-top: var(--sp-2); font-size: 0.85rem; }
</style>
</head>
<body>

<header class="hero" style="padding: var(--sp-6) 0;">
  <div class="container">
    <p class="hero-badge" style="display:inline-flex;"><span>杉田夢生 <span class="en">/ Sugita Yumeki</span></span></p>
    <h1 style="max-width:100%;">周囲の方への<br><span class="hl">一言メッセージ</span>のお願い</h1>
    <p class="hero-lede">
      一緒にお仕事をした際の率直な感想を、一言いただけると嬉しいです。<br>
      いただいた内容の一部は、ご本人に内容を確認のうえ、ポートフォリオサイトの「周囲からの声」に掲載させていただく場合があります（掲載時はお名前・会社名を伏せることも可能です）。
    </p>
  </div>
</header>

<main>
  <section class="on-light">
    <div class="container" style="max-width: 640px;">
      <!-- Googleフォームを直接埋め込み。回答は自動的にフォームに紐づくGoogleスプレッドシートへ集計される。
           iframeなのでJS不要で動作する（本体サイトのprogressive enhancement方針と両立）。 -->
      <iframe class="voice-form-embed" src="https://docs.google.com/forms/d/e/1FAIpQLSfE0qfYftVsnFOiK_HISeNGgP2E4geK8tMZSCmG3mnfmZ-Yrw/viewform?embedded=true" title="一言メッセージフォーム">
        読み込んでいます…
      </iframe>
      <p class="voice-form-fallback">
        フォームが表示されない場合は、<a href="https://forms.gle/v8dnvnhX8GUVzTMP7" target="_blank" rel="noopener">こちらから直接開いて</a>ご記入ください。
      </p>
    </div>
  </section>
</main>

<footer>
  <p><a href="index.html">← ポートフォリオサイトに戻る</a></p>
  &copy; 2026 Sugita Yumeki
</footer>

</body>
</html>
