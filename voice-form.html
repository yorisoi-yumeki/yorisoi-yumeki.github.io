<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一言メッセージをお寄せください | 杉田夢生</title>
<meta name="description" content="杉田夢生への一言コメント・推薦文をお寄せください。いただいた内容の一部は、本人の確認のうえポートフォリオサイトの「周囲からの声」に掲載させていただく場合があります。">
<meta name="robots" content="noindex">

<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero" style="padding: var(--sp-6) 0;">
  <div class="container">
    <a class="hero-badge" href="index.html" style="display:inline-flex;"><span>杉田夢生 <span class="en">/ Sugita Yumeki</span></span></a>
    <h1 style="max-width:100%;">周囲の方への<br><span class="hl">一言メッセージ</span>のお願い</h1>
    <p class="hero-lede">
      一緒にお仕事をした際の率直な感想を、一言いただけると嬉しいです。<br>
      いただいた内容の一部は、ご本人に内容を確認のうえ、ポートフォリオサイトの「周囲からの声」に掲載させていただく場合があります（掲載時はお名前・会社名を伏せることも可能です）。
    </p>
  </div>
</header>

<main>
  <section class="on-light">
    <div class="container" style="max-width: 640px;">

      <!-- 見た目は完全にこのサイト独自のフォームだが、送信するとJS(assets/js/voice-form.js)が
           Googleフォームの回答送信エンドポイントへ直接データを送る（画面遷移なし）。
           回答は通常のGoogleフォーム回答と同様に、紐づくスプレッドシートに集計される。
           JSが無効な環境向けに、下に元のGoogleフォームへのリンクをフォールバックとして用意している。 -->
      <form id="voice-form" novalidate>
        <div class="form-row">
          <label for="voice-name">お名前<span class="form-optional">（イニシャル可）</span> <span class="form-required">*</span></label>
          <input type="text" id="voice-name" placeholder="例：山田 太郎 / Y.T." autocomplete="name" required>
        </div>

        <div class="form-row">
          <label>関係性 <span class="form-required">*</span></label>
          <div class="form-choice-group" role="radiogroup" aria-required="true">
            <label class="form-choice"><input type="radio" name="relation" value="同僚" required> 同僚</label>
            <label class="form-choice"><input type="radio" name="relation" value="上司／先輩"> 上司／先輩</label>
            <label class="form-choice"><input type="radio" name="relation" value="部下／後輩"> 部下／後輩</label>
            <label class="form-choice"><input type="radio" name="relation" value="取引先"> 取引先</label>
          </div>
        </div>

        <div class="form-row">
          <label>どんな点が良かったか<span class="form-optional">（複数選択可）</span> <span class="form-required">*</span></label>
          <div class="form-choice-group" id="good-points-group">
            <label class="form-choice"><input type="checkbox" value="潜在ニーズを引き出すヒアリング"> 潜在ニーズを引き出すヒアリング</label>
            <label class="form-choice"><input type="checkbox" value="行き詰まっても別の切り口で提案し直す粘り強さ"> 行き詰まっても別の切り口で提案し直す粘り強さ</label>
            <label class="form-choice"><input type="checkbox" value="相手の知識レベルに合わせた分かりやすい説明"> 相手の知識レベルに合わせた分かりやすい説明</label>
            <label class="form-choice"><input type="checkbox" value="ナレッジの横展開"> ナレッジの横展開</label>
            <label class="form-choice"><input type="checkbox" value="社内営業力"> 社内営業力</label>
            <label class="form-choice form-choice-other">
              <input type="checkbox" id="good-points-other-check"> その他：
              <input type="text" id="good-points-other-text" class="form-inline-text" placeholder="自由記述" aria-label="その他の内容">
            </label>
          </div>
        </div>

        <div class="form-row">
          <label for="voice-comment">一言コメント<span class="form-optional">（印象的なエピソードなどがあれば教えてください）</span></label>
          <textarea id="voice-comment" rows="5"></textarea>
        </div>

        <div class="form-row">
          <label>掲載について <span class="form-required">*</span></label>
          <div class="form-choice-group" role="radiogroup" aria-required="true">
            <label class="form-choice"><input type="radio" name="publish" value="名前付きで掲載して良い" required> 名前付きで掲載して良い</label>
            <label class="form-choice"><input type="radio" name="publish" value="イニシャルなら掲載して良い"> イニシャルなら掲載して良い</label>
            <label class="form-choice"><input type="radio" name="publish" value="今回は掲載しないで欲しい（本人向けのメッセージのみ）"> 今回は掲載しないで欲しい（本人向けのメッセージのみ）</label>
          </div>
        </div>

        <p class="form-error" id="voice-form-error" hidden>必須項目（※）が未入力です。ご確認のうえ、もう一度お試しください。</p>

        <button type="submit" class="btn btn-primary" id="voice-form-submit">回答を送信</button>
      </form>

      <div class="voice-form-done" id="voice-form-done" hidden>
        <h2>送信しました！</h2>
        <p>一言メッセージをお届けいただき、ありがとうございます。</p>
      </div>

      <noscript>
        <p class="form-note">このフォームの送信にはJavaScriptが必要です。JSが無効な場合は、<a href="https://forms.gle/v8dnvnhX8GUVzTMP7" target="_blank" rel="noopener">こちらのGoogleフォーム</a>から直接ご記入ください。</p>
      </noscript>
    </div>
  </section>
</main>

<footer>
  <p><a href="index.html">← ポートフォリオサイトに戻る</a></p>
  &copy; 2026 Sugita Yumeki
</footer>

<script src="assets/js/voice-form.js"></script>
</body>
</html>
